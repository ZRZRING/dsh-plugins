# Slash commands backed by Markdown files.
#
# Every `*.md` file under the configured roots becomes a host slash command
# named after the file. Invoking it puts the whole file into the user prompt;
# nothing is advertised to the model in advance and no YAML frontmatter is
# required.
#
# These values are only the shipped defaults. Everything worth tuning lives in
# config.json beside this patch, which is re-read on every scan (no reinstall,
# no restart).
- insert:
    - id: command-files
      name: '@local/dsh-command-files'
      config:
        # 'off' unregisters every command without unloading the plugin.
        enabled: true
        # Extra roots, absolute or '~'-prefixed. Empty keeps the defaults
        # (~/.agents/commands and ~/.agents/command).
        dirs: []
        includeDefaults: true
        # Watch the roots so added/removed/edited files refresh live.
        watch: true
        # Refuse a file larger than this many bytes instead of flooding a turn.
        maxBytes: 262144
        # Menu description length cap.
        descriptionMaxLength: 120
        # Wrap the body in <command_content>; false injects the raw file text.
        wrap: true
        # false queues the body for your next prompt (keep typing first);
        # true sends it immediately as a new turn.
        immediate: false
        # Built-in withdrawal command. Before sending it removes the pending
        # injection from the inbox; after sending it shadows the committed node
        # from the model context. Empty registers no command.
        undoCommand: uninject
        # Result text language: 'zh' or 'en'.
        locale: zh
        # Append one diagnostic line per scan/injection to
        # %TEMP%\dsh-command-files.log.
        debugLog: true
