# Slash commands backed by Markdown files, delivered as user-invocable skills.
#
# Every `*.md` file under the configured roots becomes a `/name` entry in the
# skills group of the `/` menu, named after the file. Picking it only inserts
# the literal `/name ` text: keep typing, send one message, or delete the token
# to cancel. The body is injected once at send time by the host's own skill
# gesture boundary. Nothing is advertised to the model in advance and no YAML
# frontmatter is required.
#
# These values are only the shipped defaults. Everything worth tuning lives in
# config.json beside this patch, which is re-read on every discovery (no
# reinstall, no restart).
- insert:
    - id: command-files
      name: '@local/dsh-command-files'
      config:
        # false hides every command without unloading the plugin.
        enabled: true
        # Extra roots, absolute or '~'-prefixed. Empty keeps the defaults
        # (~/.agents/commands and ~/.agents/command).
        dirs: []
        includeDefaults: true
        # Watch the roots so added/removed/edited files refresh live.
        watch: true
        # Refuse a file larger than this many bytes instead of flooding a turn.
        maxBytes: 262144
        # Menu description length cap.
        descriptionMaxLength: 120
        # Fallback description language: 'zh' or 'en'.
        locale: zh
        # Append one diagnostic line per scan/load to
        # %TEMP%\dsh-command-files.log.
        debugLog: true
