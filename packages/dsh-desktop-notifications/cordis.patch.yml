# Desktop attention: one native notification when a root task completes, fails,
# or waits for the user's confirmation.
#
# These values are only the shipped defaults. Everything a user wants to tune —
# switches and notification copy alike — lives in config.json beside this patch,
# which is re-read on every trigger (no reinstall, no restart).
- insert:
    - id: desktop-notifications
      name: '@local/dsh-desktop-notifications'
      config:
        # 'always' notifies on every trigger; 'off' silences the plugin.
        mode: always
        # 'none' | 'ding' (C:\Windows\Media\ding.wav) | 'system' (your sound scheme).
        sound: none
        # Toast identity; Windows shows this app name on the notification.
        aumid: Microsoft.Windows.PowerShell
        onComplete: true
        onFailure: true
        onWaiting: true
        # Notification copy language: 'zh' or 'en'.
        locale: zh
        # Append one diagnostic line per decision to
        # %TEMP%\dsh-desktop-notifications.log.
        debugLog: true
