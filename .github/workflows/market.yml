name: market

on:
  push:
    paths:
      - 'market/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/market.yml'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate the market index against its configuration
        run: npm run check
